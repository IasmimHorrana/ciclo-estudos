name: Publicar no GitHub Pages

# Publica o app (pasta app/) sempre que a main mudar. Só o código vai para o ar; os dados de estudo ficam no navegador de cada pessoa.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Dois jobs separados (como o GitHub recomenda): com o envio e a publicação no mesmo job, o deploy-pages às vezes
  # não acha o pacote recém-enviado ("No artifacts named github-pages", actions/deploy-pages#451).
  gerar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /ciclo-estudos/
          # Nuvem (Supabase): só a URL e a chave PUBLICÁVEL, guardadas como variáveis do repositório.
          # Nunca a chave secreta/service_role. A proteção dos dados vem das regras (RLS) no banco.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
