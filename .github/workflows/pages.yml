name: Publicar no GitHub Pages

# Publica o app (pasta app/) sempre que a main mudar. Só o código vai para o ar; os dados de estudo ficam no navegador de cada pessoa.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /ciclo-estudos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
