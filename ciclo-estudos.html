// Ajusta o texto para o formato do app. Função pura (testável): opções em `o`.
function adaptarTexto(t, o) {
  const L = String(t).replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '').replace(/\u00a0/g, ' ').split('\n');
  const out = [];
  let dentro = false;
  for (let i = 0; i < L.length; i++) {
    let l = L[i];
    if (/^\s*```/.test(l)) { dentro = !dentro; out.push(l); continue; }
    if (dentro) { out.push(l); continue; }
    if (o.citacoes) l = l.replace(/\s*\[(?:\d+(?:\s*[-–,]\s*\d+)*)\]/g, '');
    if (o.marcadores) {
      l = l.replace(/^(\t+)/, s => '  '.repeat(s.length)).replace(/^(\s*)[•◦▪‣∙·●○–—]\s+/, '$1- ').replace(/^(\s*)\*\s+/, '$1- ');
    }
    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
// Divide em várias notas a cada "## Título" (ignora ## dentro de blocos de código)
function dividirSecoes(texto, base) {
  const L = texto.split('\n'), partes = [];
  let atual = { titulo: base, linhas: [] }, dentro = false, achou = 0;
  L.forEach(l => {
    if (/^\s*```/.test(l)) dentro = !dentro;
    const m = !dentro && l.match(/^##\s+(.+)$/);
    if (m) {
      achou++;
      if (atual.linhas.join('').trim()) partes.push(atual);
      atual = { titulo: `${base} — ${m[1].trim()}`, linhas: [`# ${m[1].trim()}`] };
    } else atual.linhas.push(l);
  });
  if (atual.linhas.join('').trim()) partes.push(atual);
  return achou < 1 ? [{ titulo: base, texto }] : partes.map(p => ({ titulo: p.titulo, texto: p.linhas.join('\n').trim() + '\n' }));
}
function parseMd(txt, nome) {
  const meta = {};
  let corpo = txt.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const m = corpo.match(/^---\n([\s\S]*?)\n---\n?/);
  if (m) {
    m[1].split('\n').forEach(l => { const k = l.match(/^(\w+):\s?(.*)$/); if (k) meta[k[1]] = k[2].trim(); });
    corpo = corpo.slice(m[0].length).replace(/^\n+/, '');
  }
  return { id: meta.id, titulo: meta.titulo || nome.replace(/\.(md|markdown|txt)$/i, ''), materia: meta.materia || '', atualizado: parseInt(meta.atualizado) || 0, texto: corpo };
}

const nomeSeguro = s => (String(s).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').slice(0, 80)) || 'sem-titulo';
function caminhoNota(n, usados) {
  const pasta = nomeSeguro(n.materia || 'Sem matéria');
  let c = `${pasta}/${nomeSeguro(n.titulo)}.md`;
  if (usados.has(c.toLowerCase())) c = `${pasta}/${nomeSeguro(n.titulo)} (${n.id.slice(-4)}).md`;
  usados.add(c.toLowerCase());
  return c;
}
const notaParaArquivo = n => `---\nid: ${n.id}\ntitulo: ${n.titulo.replace(/\n/g, ' ')}\nmateria: ${n.materia}\natualizado: ${n.atualizado}\n---\n\n${n.texto}`;

const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function criarZip(arqs) {            // arquivos sem compressão (método 0), nomes em UTF-8
  const enc = new TextEncoder(), loc = [], cen = [];
  let off = 0;
  const d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  arqs.forEach(a => {
    const nome = enc.encode(a.nome), dados = enc.encode(a.texto), crc = crc32(dados);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosT, true); h.setUint16(12, dosD, true); h.setUint32(14, crc, true);
    h.setUint32(18, dados.length, true); h.setUint32(22, dados.length, true); h.setUint16(26, nome.length, true); h.setUint16(28, 0, true);
    loc.push(new Uint8Array(h.buffer), nome, dados);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosT, true); c.setUint16(14, dosD, true); c.setUint32(16, crc, true);
    c.setUint32(20, dados.length, true); c.setUint32(24, dados.length, true); c.setUint16(28, nome.length, true);
    c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nome);
    off += 30 + nome.length + dados.length;
  });
  const tamCen = cen.reduce((s, x) => s + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, arqs.length, true); e.setUint16(10, arqs.length, true);
  e.setUint32(12, tamCen, true); e.setUint32(16, off, true);
  return new Blob([...loc, ...cen, new Uint8Array(e.buffer)], { type: 'application/zip' });
}

// ----- backup automático em pasta (File System Access API: Chrome/Edge) -----
const BK = { handle: null, estado: 'inativo', timer: null, erro: '' };   // estado: inativo | ok | gravando | permissao | erro
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('cicloEstudos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

async function dirDe(raiz, caminho, criar) {
  let d = raiz;
  for (const p of caminho.split('/').slice(0, -1)) d = await d.getDirectoryHandle(p, { create: criar });
  return d;
}
async function escreverArquivo(caminho, conteudo) {
  const d = await dirDe(BK.handle, caminho, true);
  const f = await d.getFileHandle(caminho.split('/').pop(), { create: true });
  const w = await f.createWritable(); await w.write(conteudo); await w.close();
}
async function apagarArquivo(caminho) {
  try { const d = await dirDe(BK.handle, caminho, false); await d.removeEntry(caminho.split('/').pop()); } catch (e) {}
}
async function bkCarregarHandle() {
  if (!window.showDirectoryPicker) return;
  try {
    const h = await idbGet('pasta');
    if (h) { BK.handle = h; BK.estado = (await h.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'permissao'; }
  } catch (e) {}
}
function agendarBackup() {
  if (!BK.handle || BK.estado !== 'ok') return;
  clearTimeout(BK.timer); BK.timer = setTimeout(() => bkGravarTudo(false), 2000);
}
async function bkGravarTudo(force) {
  if (!BK.handle) return;
  clearTimeout(BK.timer);
  BK.estado = 'gravando'; atualizarStatusBackup();
  try {
    const b = state.backup, usados = new Set(), novos = {}, novosHashes = {}, antigos = force ? {} : b.hashes;
    for (const n of state.notas) {
      const caminho = caminhoNota(n, usados), conteudo = notaParaArquivo(n), h = hashStr(caminho + '\u0001' + conteudo);
      novos[n.id] = caminho; novosHashes[n.id] = h;
      if (antigos[n.id] !== h) await escreverArquivo(caminho, conteudo);
    }
    for (const [id, antigo] of Object.entries(b.arquivos)) if (novos[id] !== antigo) await apagarArquivo(antigo);   // só apaga o que o app criou
    await escreverArquivo('_backup-app.json', JSON.stringify(state));
    b.arquivos = novos; b.hashes = novosHashes; b.ultimoBackup = Date.now(); BK.estado = 'ok'; BK.erro = '';
  } catch (e) {
    BK.estado = e && e.name === 'NotAllowedError' ? 'permissao' : 'erro';
    BK.erro = (e && e.message) || String(e);

}
async function bkEscolher() {
  let h;

  BK.handle = h; state.backup.nomePasta = h.name; state.backup.hashes = {}; state.backup.arquivos = {};
  try { await idbSet('pasta', h); } catch (e) {}

  persistir(); await bkGravarTudo(true);
}
async function bkReconectar() {
  try {

    else alerta('Backup', 'A permissão não foi concedida. O backup continua desligado.');
  } catch (e) { alerta('Backup', 'Não foi possível reconectar: ' + (e.message || e)); }
}
async function varrerPasta(dir, prefixo, out, prof) {
  for await (const [nome, h] of dir.entries()) {
    if (nome.startsWith('.') || nome.startsWith('_')) continue;
    if (h.kind === 'directory') { if (prof < 3) await varrerPasta(h, prefixo + nome + '/', out, prof + 1); }
    else if (/\.(md|markdown)$/i.test(nome)) out.push({ nome, pasta: prefixo.split('/')[0], file: await h.getFile() });
  }
}

// GRÁFICOS (SVG próprio, sem bibliotecas)
// ============================================================
function arcoAnel(cx, cy, R, r, a0, a1) {
  const p = (rad, a) => [(cx + rad * Math.cos(a)).toFixed(2), (cy + rad * Math.sin(a)).toFixed(2)];
  const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0), g = a1 - a0 > Math.PI ? 1 : 0;
  return `M${x0} ${y0} A${R} ${R} 0 ${g} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${g} 0 ${x3} ${y3} Z`;
}
// rosca com legenda: dados = [{ nome, valor, cor, rotulo }]
function roscaSVG(dados, centro, sub) {
  const total = soma(dados, d => d.valor);
  if (!total) return '<p class="muted" style="text-align:center">Sem dados no período.</p>';
  let a0 = -Math.PI / 2, seg = '';
  dados.filter(d => d.valor > 0).forEach(d => {
    const ang = Math.min(d.valor / total * Math.PI * 2, Math.PI * 2 - 0.0001);
    seg += `<path d="${arcoAnel(90, 90, 82, 54, a0, a0 + ang)}" fill="${d.cor}" stroke="var(--card)" stroke-width="1.5"><title>${esc(d.nome)}: ${esc(d.rotulo)}</title></path>`;
    a0 += d.valor / total * Math.PI * 2;
  });
  const leg = dados.filter(d => d.valor > 0).map(d => `<span><i class="dot" style="background:${d.cor}"></i>${esc(d.nome)} · ${esc(d.rotulo)}</span>`).join('');
  return `<div class="rosca"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(sub)}">${seg}<text x="90" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)">${esc(centro)}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sub)}</text></svg><div class="rosca-leg">${leg}</div></div>`;
}
// rosca do ciclo da semana: um segmento por passo; feito = cor cheia, pendente = clara
function roscaCiclo(s) {
  const n = s.passos.length;
  if (!n) return '';
  const fatia = Math.PI * 2 / n, gap = Math.min(0.03, fatia * 0.25);
  let seg = '';
  s.passos.forEach((p, i) => {
    const a0 = -Math.PI / 2 + i * fatia + gap / 2, a1 = -Math.PI / 2 + (i + 1) * fatia - gap / 2;
    seg += `<path d="${arcoAnel(90, 90, 82, 54, a0, a1)}" fill="${cor(p.materia)}" opacity="${p.feito ? 1 : 0.32}"><title>${p.id}. ${esc(p.materia)}${p.feito ? ' ✓' : ''}</title></path>`;
  });
  const feitos = s.passos.filter(p => p.feito).length;
  const leg = [...new Set(s.passos.map(p => p.materia))].map(m => `<span><i class="dot" style="background:${cor(m)}"></i>${esc(m)}</span>`).join('');
  return `<div class="rosca"><svg viewBox="0 0 180 180" role="img" aria-label="Ciclo da semana">${seg}<text x="90" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">${feitos}/${n}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--muted)">passos feitos</text></svg><div class="rosca-leg">${leg}</div></div>`;
}
// barras empilhadas: cols = [{ label, partes:[{ v, cor, t }] }]
function barrasSVG(cols, fmt) {
  const W = 640, H = 170, pad = 16, base = H - 24, tot = c => soma(c.partes, p => p.v);
  const max = Math.max(0, ...cols.map(tot));
  if (!max) return '<p class="muted" style="text-align:center">Sem dados no período.</p>';
  const n = cols.length, passo = (W - pad * 2) / n, bw = Math.max(4, Math.min(34, passo * 0.62));
  let g = '';
  cols.forEach((c, i) => {
    const x = pad + i * passo + (passo - bw) / 2;
    let y = base;
    c.partes.forEach(p => {
      const h = p.v / max * (base - 20);
      if (h <= 0) return;
      y -= h;
      g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${p.cor}"><title>${esc(p.t)}</title></rect>`;
    });
    if (tot(c) > 0 && n <= 14) g += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text)">${fmt(tot(c))}</text>`;
    if (n <= 10 || i % Math.ceil(n / 10) === 0) g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${c.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}<line x1="${pad}" x2="${W - pad}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg>`;
}

  };

  // gráficos
  const porMat = mats.map(m => ({ nome: m, valor: horasDe(ss.filter(x => x.materia === m)), cor: cor(m) })).filter(d => d.valor > 0).sort((a, b) => b.valor - a.valor);
  porMat.forEach(d => { d.rotulo = fmtH(d.valor); });
  const horas = horasDe(ss);
  const tipos = ['Teoria', 'Questões', 'Revisão'].map(t => `${t}: <b>${fmtH(horasDe(ss.filter(x => (x.tipo || 'Teoria') === t)))}</b>`).join(' · ');

  });
  const colsQ = Array.from({ length: N }, (_, i) => {
    const iso = addDias(hoje(), -(N - 1 - i)), q = state.questoes.filter(x => x.data === iso), f = soma(q, x => x.feitas), a = soma(q, x => x.acertos);
    return { label: fmtData(iso), partes: [{ v: a, cor: 'var(--accent)', t: `${fmtData(iso)}: ${a} acertos` }, { v: f - a, cor: 'var(--bad)', t: `${fmtData(iso)}: ${f - a} erros` }] };
  });
  const acertoMat = mats.map(m => { const qm = qs.filter(q => q.materia === m), f = soma(qm, q => q.feitas), a = soma(qm, q => q.acertos); return { m, f, a }; }).filter(x => x.f > 0).sort((a, b) => pctDe(b.a, b.f) - pctDe(a.a, a.f));
  const ultimos = [...state.questoes].sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id)).slice(0, 8);
  const optMat = [...new Set([...ordem, ...mats])].map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');

const assuntoPorId = id => state.assuntos.find(a => a.id === id);
function dsPeriodo(p) { dsUI.periodo = p; renderDesempenho(); }
function dsToggle(d) { if (d.open) dsUI.abertas.add(d.dataset.m); else dsUI.abertas.delete(d.dataset.m); }

function dsAddAssuntos() {

  nomes.forEach(n => {

  });

function dsRenomear(id) {

function dsExcluir(id) {

function abrirQuestoes(o = {}) {
  const mats = [...new Set([...todasMaterias(), ...state.assuntos.map(a => a.materia)])];
  const hojeDoCiclo = state.semana ? state.semana.passos.find(p => p.dia === hoje()) : null;
  const m0 = o.materia || (hojeDoCiclo && hojeDoCiclo.materia) || mats[0];
  modal('Registrar questões', `
    <div class="grid2">
      <label class="f">Data<input type="date" id="qData" value="${esc(o.data || hoje())}" max="${hoje()}"></label>
      <label class="f">Matéria<select id="qMat" onchange="qAtualizarAssuntos()">${mats.map(m => `<option value="${esc(m)}" ${m === m0 ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
    </div>
    <label class="f" style="margin-top:10px">Assunto<select id="qAss"></select></label>
    <label class="f" style="margin-top:10px">…ou criar um assunto novo<input id="qNovo" placeholder="Ex.: Prescrição" value="${esc(o.novo || '')}"></label>
    <div class="grid2" style="margin-top:10px">
      <label class="f">Questões feitas<input type="number" id="qFeitas" min="1" step="1" value="${Number.isFinite(o.feitas) ? o.feitas : ''}"></label>
      <label class="f">Acertos<input type="number" id="qAcertos" min="0" step="1" value="${Number.isFinite(o.acertos) ? o.acertos : ''}"></label>
    </div>`, [{ t: 'Cancelar' }, { t: 'Salvar', c: 'primary', f: salvarQuestoes }]);
  qAtualizarAssuntos(o.assuntoId);
}
function qAtualizarAssuntos(sel) {
  const m = $('qMat').value;
  $('qAss').innerHTML = '<option value="">— sem assunto —</option>' + state.assuntos.filter(a => a.materia === m).map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.nome)}</option>`).join('');
}
function salvarQuestoes() {
  const d = { data: $('qData').value, materia: $('qMat').value, assuntoId: $('qAss').value, novo: $('qNovo').value.trim(), feitas: parseInt($('qFeitas').value), acertos: parseInt($('qAcertos').value) };
  let erro = '';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data)) erro = 'Informe a data.';
  else if (d.data > hoje()) erro = 'A data não pode ser no futuro.';
  else if (!d.materia) erro = 'Escolha a matéria.';
  else if (!(d.feitas >= 1)) erro = 'Informe quantas questões você fez (mínimo 1).';
  else if (!(d.acertos >= 0) || d.acertos > d.feitas) erro = 'Os acertos precisam estar entre 0 e o número de questões feitas.';
  if (erro) { modal('Dados inválidos', `<p>${esc(erro)}</p>`, [{ t: 'Corrigir', c: 'primary', f: () => abrirQuestoes(d) }]); return; }
  let id = d.assuntoId || null;
  if (d.novo) {
    let ex = state.assuntos.find(a => a.materia === d.materia && norm(a.nome) === norm(d.novo));
    if (!ex) { ex = { id: novoId(), materia: d.materia, nome: d.novo }; state.assuntos.push(ex); }
    id = ex.id;
  }
  state.questoes.push({ id: novoId(), data: d.data, materia: d.materia, assuntoId: id, feitas: d.feitas, acertos: d.acertos });
  dsUI.abertas.add(d.materia);
  salvar();
  if (abaAtual === 'desempenho') renderDesempenho();
}
function htmlQuestoesHoje() {
  const q = state.questoes.filter(x => x.data === hoje()), f = soma(q, x => x.feitas), a = soma(q, x => x.acertos);
  return `<div class="row" style="margin-top:8px;justify-content:space-between;flex-wrap:nowrap"><span class="muted">Questões hoje: <b>${f}</b>${f ? ` · ${pctDe(a, f)}%` : ''}</span><button class="btn sm" onclick="abrirQuestoes()" title="Registrar questões" aria-label="Registrar questões">＋ Questões</button></div>`;
}

// Avisos globais no topo: semana encerrada e dicas de restauração
function dispensarHint() { lsSet('ciclo.hintRestaurar', '1'); atualizarAviso(); }
function atualizarAviso() {
  const el = $('aviso'), s = state.semana;
  if (s && hoje() > s.dom) {
    el.innerHTML = `<span>📅 A semana ${fmtData(s.seg)} → ${fmtData(s.dom)} já terminou. Feche-a para salvar as estatísticas.</span>` +
      (abaAtual === 'semana' ? '' : `<button class="btn sm" onclick="showTab('semana')">Ir para a semana</button>`);
    el.hidden = false;
  } else if (!s && !state.notas.length && !state.fechadas.length && window.showDirectoryPicker && !lsGet('ciclo.hintRestaurar')) {
    el.innerHTML = `<span>💾 Já usou o app antes e perdeu os dados? Restaure de uma pasta de backup.</span><span class="row"><button class="btn sm" onclick="bkRestaurar()">Restaurar de uma pasta</button><button class="btn sm" onclick="dispensarHint()">Dispensar</button></span>`;
    el.hidden = false;
  } else el.hidden = true;
}
// Virada de dia com a página aberta: atualiza o destaque de "hoje" e o aviso
function checarVirada() {
  if (hoje() === dataRender) return;
  dataRender = hoje(); atualizarAviso(); renderLateral();
  const ativo = document.activeElement;
  if (abaAtual === 'semana' && !(ativo && /INPUT|SELECT/.test(ativo.tagName))) renderSemana();
  else if (abaAtual === 'montar') renderMontar();
}
setInterval(checarVirada, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVirada(); });

aplicarTema();
// em telas estreitas a barra lateral vem recolhida (o menu continua visível)
if (window.matchMedia && matchMedia('(max-width:900px)').matches) document.querySelectorAll('details.lat').forEach(d => { d.open = false; });
showTab(state.semana ? 'semana' : 'montar');
// reconecta com a pasta de backup salva (se o navegador a lembrar) e atualiza o status
bkCarregarHandle().then(() => { atualizarStatusBackup(); if (BK.estado === 'ok') agendarBackup(); });
</script>
</body>
