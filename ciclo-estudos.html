<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciclo de Estudos</title>
<style>
/* Paleta inspirada no Estudei: fundo cinza-claro, cartões brancos, verde-menta de destaque, pastéis por matéria */
:root{
  --bg:#f4f5f5; --side:#eef1f0; --card:#ffffff; --text:#2b302f; --muted:#6c7773; --line:#e2e7e5;
  --accent:#1f9d7f; --accent-text:#ffffff; --soft:#e3f5ef; --ok:#16a34a; --warn:#b45309; --bad:#dc2626;
  --warn-bg:#fef3c7; --ok-bg:#dcfce7; --bad-bg:#fee2e2; --shadow:0 1px 3px rgba(31,48,42,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131817; --side:#171d1b; --card:#1b2220; --text:#e7efec; --muted:#93a39e; --line:#2a3330;
    --accent:#5fd3b3; --accent-text:#06281f; --soft:#1d3a33; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --warn-bg:#3a2e10; --ok-bg:#12331f; --bad-bg:#3b1a1a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#131817; --side:#171d1b; --card:#1b2220; --text:#e7efec; --muted:#93a39e; --line:#2a3330;
  --accent:#5fd3b3; --accent-text:#06281f; --soft:#1d3a33; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --warn-bg:#3a2e10; --ok-bg:#12331f; --bad-bg:#3b1a1a; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* sem isso, regras com display:grid/flex reexibem seções escondidas (abas) */
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
/* Layout em tela cheia: barra lateral fixa + área principal que usa toda a largura */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:1.05rem;padding:2px 4px}
.navs{display:flex;flex-direction:column;gap:2px}
.main{padding:20px 28px;min-width:0}
h1{font-size:1.5rem;margin:0;font-weight:700}
h2{font-size:1.05rem;margin:0 0 12px;font-weight:650}
h3{font-size:.95rem;margin:0 0 8px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:8px 10px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tab:hover{background:var(--soft)}
.tab.on{background:var(--soft);color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.muted{color:var(--muted);font-size:.875rem}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--text);padding:8px 14px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.mrow label{font-size:.8rem;color:var(--muted);white-space:nowrap}
.counter{padding:8px;border-radius:8px;text-align:center;font-size:.875rem;font-weight:600;margin:10px 0}
.counter.ok{background:var(--ok-bg);color:var(--ok)}
.counter.warn{background:var(--warn-bg);color:var(--warn)}
.counter.bad{background:var(--bad-bg);color:var(--bad)}
.layout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:1.25rem}
.passo{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.passo:last-child{border-bottom:0}
.passo.done .nome{text-decoration:line-through;color:var(--muted)}
.passo input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.passo .nome{font-weight:600;display:flex;align-items:center;gap:8px}
.passo .num{color:var(--muted);font-weight:500;font-size:.8rem;min-width:1.6em}
.passo .sub{grid-column:2 / -1;display:flex;gap:8px}
.passo .nota{flex:1;width:100%;font-size:.85rem;padding:5px 8px;border-style:dashed}
.passo .dia{font-size:.8rem;padding:4px 6px;max-width:130px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:6px 12px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.dia-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 4px 4px;border-bottom:2px solid var(--line)}
.dia-h:first-of-type{padding-top:4px}
.badge.hoje{background:var(--soft);color:var(--accent)}
.badge.atraso{background:var(--bad-bg);color:var(--bad)}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.aviso[hidden]{display:none}
.hojebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-weight:600}
.passo .sub{flex-wrap:wrap}
/* ----- Resumos ----- */
.rs-layout{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.rs-side{position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto;margin-bottom:0;background:var(--side)}
.rs-nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);padding:7px 8px;border-radius:7px;font-weight:600;text-align:left}
.rs-nav:hover{background:var(--soft)}
.rs-nav.acc{color:var(--accent)}
.pill{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 8px;font-size:.78rem;color:var(--muted);font-weight:600}
.sq{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none}
.crumb{font-size:.85rem;margin-bottom:6px}
.rs-titulo{font-size:2rem;font-weight:800;border:0;background:transparent;width:100%;padding:4px 0;flex:1}
.rs-titulo:focus{outline:none;border-bottom:2px solid var(--accent)}
.box:has(#impTexto){max-width:640px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.875rem;margin:6px 0}
#view-flashcards>.card{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rs-g{display:flex;align-items:center;gap:6px;margin:12px 0 4px;font-size:.8rem;font-weight:700;color:var(--muted)}
.rs-g .plus{margin-left:auto;border:0;background:transparent;color:var(--muted);font-weight:700;padding:0 6px}
.rs-gt{display:flex;align-items:center;gap:6px;flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-align:left;padding:3px 0;border-radius:6px}
.rs-gt:hover{color:var(--text)}
.rs-gt .chev{width:12px;flex:none;font-size:.7rem}
.rs-gt .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-gt .gc{flex:none;font-weight:600;font-size:.72rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 7px}
.rs-tools{margin:8px 2px 0;font-size:.78rem;color:var(--muted)}
.rs-link{border:0;background:transparent;color:var(--accent);font-size:.78rem;font-weight:600;padding:0}
.rs-n{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:6px 8px;border-radius:7px;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-n:hover{background:var(--soft)}
.rs-n.on{background:var(--soft);color:var(--accent);font-weight:700}
.rs-edit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rs-edit.m-editar,.rs-edit.m-ver{grid-template-columns:1fr}
.rs-edit.m-editar .md,.rs-edit.m-ver textarea{display:none}
textarea.rs{width:100%;min-height:62vh;font:14px/1.55 ui-monospace,Consolas,"Courier New",monospace;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);color:var(--text)}
.md{border:1px solid var(--line);border-radius:10px;padding:4px 16px 12px;min-height:200px;overflow-wrap:anywhere}
.md h1{font-size:1.5rem}.md h2{font-size:1.25rem}.md h3{font-size:1.1rem}
.md h1,.md h2,.md h3,.md h4{margin:16px 0 6px}
.md p{margin:8px 0}
.md ul,.md ol{margin:4px 0;padding-left:22px}
.md li{margin:2px 0}
.md li.k{list-style:none;margin-left:-18px}
.md summary{cursor:pointer}
.md code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.md pre{background:var(--soft);padding:10px 12px;border-radius:8px;overflow:auto}
.md pre code{background:transparent;padding:0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.md table{border-collapse:collapse;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:5px 10px}
.md hr{border:0;border-top:1px solid var(--line)}
.md a{color:var(--accent)}
.md a.wiki{font-weight:600;text-decoration:none;border-bottom:1px dashed var(--accent)}
.md a.wiki.novo{color:var(--warn);border-color:var(--warn)}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sug[hidden]{display:none}
@media (max-width:900px){
  .rs-layout{grid-template-columns:1fr}
  .rs-side{position:static;max-height:none}
  .rs-edit{grid-template-columns:1fr}
}
.passo input.h{width:72px;text-align:right}
.cap{font-size:.7rem;color:var(--muted);display:block;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.pomo{text-align:center}
.pomo .tempo{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.pomo .fase{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
.mat{display:flex;align-items:center;gap:8px;font-size:.875rem;margin-bottom:8px}
.mat .bar{flex:1;height:6px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.875rem;flex:1;min-width:180px}
.legend div{display:flex;align-items:center;gap:8px}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist:last-child{border-bottom:0}
.badge{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.no{background:var(--warn-bg);color:var(--warn)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.backdrop[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.box h3{font-size:1.1rem}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.empty{text-align:center;padding:32px 8px}
/* ----- barra lateral: seções, calendário, hoje, pomodoro ----- */
details.lat{border-top:1px solid var(--line);padding-top:8px}
details.lat>summary{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h button{border:0;background:transparent;color:var(--muted);padding:2px 10px;border-radius:6px;font-size:1.1rem;font-weight:700}
.cal-h button:hover{background:var(--soft);color:var(--text)}
.cal-h .mes{flex:1;font-size:.9rem;color:var(--text)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .dn{color:var(--muted);font-weight:700;font-size:.65rem;padding:2px 0}
.cd{position:relative;aspect-ratio:1;border:0;background:transparent;color:var(--text);border-radius:8px;font-size:.78rem;padding:0}
.cd:hover{background:var(--soft)}
.cd.fora{color:var(--muted);opacity:.45}
.cd.sem{background:var(--soft)}
.cd.hoje{background:var(--accent);color:var(--accent-text);font-weight:700}
.cd.fok{box-shadow:inset 0 -3px 0 var(--ok)}
.cd.fno{box-shadow:inset 0 -3px 0 var(--warn)}
.cd.nc{cursor:default}
.cd.nc:hover{background:transparent}
.cd .pt{position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cd .pt.ok{background:var(--ok)}
.cd.hoje .pt{background:var(--accent-text)}
.cal-leg{margin:6px 0 0;font-size:.72rem}
.lh{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 0;cursor:pointer}
.lh .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lh.done .t{text-decoration:line-through;color:var(--muted)}
.lh input{accent-color:var(--accent)}
.side{overflow-x:hidden}
.side .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.side .grid2 label{min-width:0;font-size:.78rem}
.side .grid2 input{width:100%;padding:5px 7px}
.side .pomo .tempo{font-size:2.3rem;margin:2px 0}
.side .pomo .row{justify-content:center}
/* ----- montar: matérias e modelos ----- */
.mrow2{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow2 .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow2 label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mrow2 input[type=number]{width:72px}
.mrow2 .prev{min-width:130px;text-align:right}
.mdl{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mdl .t{flex:1;min-width:140px}
.counter .btn{margin-left:8px}
/* ----- desempenho: assuntos, questões, gráficos ----- */
.bar.sm{height:5px;margin-top:5px}
.kpis{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .muted{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{display:block;font-size:1.7rem;margin-top:2px}
.d-topo{grid-column:1 / -1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.d-topo h2{margin:0;font-size:1.4rem}
#view-desempenho.vis-semanas{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.ds-m{border-bottom:1px solid var(--line)}
.ds-m:last-child{border-bottom:0}
.ds-m>summary{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;font-weight:650}
.ds-m>summary .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-m .resumo-m{font-size:.8rem;color:var(--muted);font-weight:500;white-space:nowrap}
.as{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,170px) auto auto;gap:10px;align-items:center;padding:6px 4px 6px 24px;font-size:.9rem}
.as .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as .acoes{display:flex;gap:4px}
.as .st{font-size:.78rem;color:var(--muted)}
.lv{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.lv.na{background:var(--line);color:var(--muted)}
.lv.fraco{background:var(--bad-bg);color:var(--bad)}
.lv.medio{background:var(--warn-bg);color:var(--warn)}
.lv.bom{background:var(--soft);color:var(--accent)}
.lv.dom{background:var(--ok-bg);color:var(--ok)}
.reg{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:0}
.reg .t{flex:1;min-width:0}
.rosca{display:flex;flex-direction:column;align-items:center;gap:10px}
.rosca svg{max-width:240px;width:100%}
.rosca-leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.8rem}
.rosca-leg span{display:inline-flex;align-items:center;gap:6px}
#view-desempenho{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 16px;align-items:start}
/* ----- semana: tira dos 7 dias ----- */
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:16px}
.wd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.wd:hover{background:var(--soft)}
.wd .n{font-weight:700;font-size:.8rem;color:var(--muted)}
.wd .dt{font-size:.75rem;color:var(--muted)}
.wd b{font-size:1.1rem}
.wd .bar{width:100%;height:6px;margin-top:4px}
.wd.hoje{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wd.hoje .n{color:var(--accent)}
.wd.folga{opacity:.55}
/* ----- aproveitar a largura nas outras abas ----- */
#view-montar{display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:0 16px;align-items:start}
#view-montar>.m-materias{grid-column:2;grid-row:1 / span 3}
@media (max-width:1100px){ .weekstrip{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .navs{flex-direction:row;flex-wrap:wrap}
  .tab{width:auto;flex:1;justify-content:center;padding:8px 6px;font-size:.85rem}
  .main{padding:16px}
  #view-montar,#view-desempenho{display:block}
  .as{grid-template-columns:minmax(0,1fr) auto}
  .as .bar{grid-column:1 / -1}
}
@media (max-width:760px){
  .weekstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mrow2{grid-template-columns:auto minmax(0,1fr) auto}
  .mrow2 .prev{grid-column:2 / -1;text-align:left}
  .layout{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr 1fr}
  .mrow select:first-child{grid-column:1 / -1}
  .passo{grid-template-columns:auto 1fr auto}
  .passo .feito-col{grid-column:2 / -1}
}
/* ----- barra lateral mais compacta ----- */
.side{gap:6px;padding:10px}
.navs{gap:0}
.tab{padding:6px 10px}
details.lat{padding-top:6px}
details.lat>summary{margin-bottom:6px}
.cd{aspect-ratio:auto;height:24px}
.cal-leg{font-size:.65rem;margin-top:4px}
.side .pomo .tempo{font-size:1.9rem}
.side .pomo p{font-size:.78rem}
#pomoSessoes{display:none}
.side{gap:5px}
.bk-status{margin-top:auto;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:600}
.bk-status:hover{background:var(--soft)}

<script>
// ============================================================
// CONSTANTES E ESTADO
// ============================================================
const KEY = 'cicloEstudos.app.v1';
const MATERIAS_PADRAO = [
  'Língua Portuguesa','Direito Constitucional','Direito Administrativo','Direito Tributário',
  'Contabilidade Geral','Estatística','Noções de Igualdade Racial','Informática',
  'Gestão Organizacional','Raciocínio Lógico'
];
// cores por matéria: tons pastel, legíveis como preenchimento de gráfico
const PALETA = ['#8fb0f2','#f08e7e','#7fcf8c','#c49af0','#f4cd5f','#5ec9c0','#f08fb8','#a8d65a','#f4a35f','#9aa4f2',
  '#6fb7a0','#d9b27a','#b58ae0','#e87d7d','#6cb8e6','#8fcf6a','#e8946a','#e07ab0','#9aa8b5','#c4dc6a'];

// ----- datas (sempre no fuso local do computador) -----
const NOMES_DIA = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const NOMES_DIA_LONGO = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const parseISO = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const toISO = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const hoje = () => toISO(new Date());
const addDias = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const idxDia = iso => (parseISO(iso).getDay() + 6) % 7;      // 0 = segunda … 6 = domingo
const segundaDe = iso => addDias(iso, -idxDia(iso));

function defaults() {
  return {
    tema: 'auto',
    config: { passos: 20, modo: 'Livre', custom: [], ocultas: [], duracao: 1,       // 'horas' e 'mats' são criados por migrarConfig()
              dias: [true, true, true, true, true, true, false], porDia: null },
    semana: null,
    fechadas: [],
    pomo: { foco: 25, pausa: 5, longa: 15, ate: 4 },
    cores: {},
    notas: [],       // [{ id, titulo, materia, texto (Markdown), criado, atualizado }]
    modelos: [],     // montagens salvas para reaproveitar: [{ id, nome, criado, config:{ modo, horas, duracao, mats, dias, porDia } }]
    assuntos: [],    // [{ id, materia, nome }]  (matéria aberta em assuntos)
    questoes: [],    // registros de questões: [{ id, data (ISO), materia, assuntoId|null, feitas, acertos }]
    sessoes: [],     // horas dos focos do Pomodoro: [{ id, data (ISO), materia, assuntoId|null, minutos, tipo }]
    backup: { nomePasta: '', ultimoBackup: 0, arquivos: {}, hashes: {} }   // a pasta em si fica no IndexedDB
  };
}

// matérias da lista padrão antiga (já removidas): se não estiverem em uso, são limpas dos dados salvos
const MATERIAS_ANTIGAS = ['Administração Financeira e Orçamentária (AFO)', 'Administração Pública', 'Auditoria', 'Contabilidade Geral e Avançada',
  'Contabilidade de Custos', 'Contabilidade Pública', 'Direito Civil', 'Direito Empresarial', 'Direito Penal', 'Economia', 'Finanças',
  'Legislação Tributária', 'Matemática Financeira'];

// garante que listas e objetos novos existam em dados salvos por versões anteriores
function normalizarEstado(s) {
  ['notas', 'assuntos', 'questoes', 'sessoes', 'fechadas', 'modelos'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  ['cores'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  migrarConfig(s.config);
  s.modelos.forEach(m => { if (m && m.config && !Array.isArray(m.config.mats)) m.config.mats = []; });
  // a lista padrão mudou: as matérias da lista antiga que não estão em uso de verdade (notas, assuntos, questões, horas,
  // semana atual ou semanas fechadas) saem do ciclo, dos modelos e da lista de escolha
  const real = new Set();
  [...s.notas, ...s.assuntos, ...s.questoes, ...s.sessoes].forEach(x => real.add(x.materia));
  if (s.semana) s.semana.passos.forEach(p => real.add(p.materia));
  s.fechadas.forEach(r => Object.keys(r.porMateria || {}).forEach(k => real.add(k)));
  const aposentadas = MATERIAS_ANTIGAS.filter(n => !real.has(n));
  s.config.custom = s.config.custom.filter(n => !aposentadas.includes(n));
  s.config.mats = s.config.mats.filter(m => !aposentadas.includes(m.nome));
  s.modelos.forEach(m => { if (m.config) m.config.mats = (m.config.mats || []).filter(x => !aposentadas.includes(x.nome)); });
  // e o que continua em uso e não está na lista vira matéria "própria" (a menos que você a tenha tirado da lista)
  const conhecidas = new Set([...MATERIAS_PADRAO, ...s.config.custom, ...s.config.ocultas].map(x => x.toLowerCase()));
  const usadas = [...real];
  s.config.mats.forEach(m => usadas.push(m.nome));
  s.modelos.forEach(m => ((m.config && m.config.mats) || []).forEach(x => usadas.push(x.nome)));
  usadas.forEach(n => { if (n && !conhecidas.has(n.toLowerCase())) { s.config.custom.push(n); conhecidas.add(n.toLowerCase()); } });
  return s;
}
// nº de passos = meta semanal (h) ÷ duração do passo (declaração de função: é usada antes do restante do script carregar)
function passosDe(c) { return Math.max(1, Math.round(c.horas / c.duracao)); }
// converte a configuração antiga (duas listas por modo + quantidade) para a lista única de matérias e a meta em horas
function migrarConfig(c) {
  if (!Array.isArray(c.mats)) {
    const mapa = new Map(), L = (c.linhas && c.linhas.Livre) || [], R = (c.linhas && c.linhas.Recomendado) || [];
    L.slice(0, (c.qtd && c.qtd.Livre) || L.length).forEach(l => { if (l && l.nome) mapa.set(l.nome, { nome: l.nome, rep: parseInt(l.peso) || 0, peso: 3 }); });
    R.slice(0, (c.qtd && c.qtd.Recomendado) || R.length).forEach(l => {
      if (!l || !l.nome) return;
      const m = mapa.get(l.nome) || { nome: l.nome, rep: 0, peso: 3 };
      m.peso = parseInt(l.peso) || 3; mapa.set(l.nome, m);
    });
    c.mats = [...mapa.values()];
  }
  delete c.linhas; delete c.qtd;
  if (!(c.duracao > 0)) c.duracao = 1;
  if (!(c.horas > 0)) c.horas = Math.round((c.passos || 20) * c.duracao * 100) / 100;
  c.passos = passosDe(c);
  c.mats.forEach(m => { m.rep = Math.min(Math.max(parseInt(m.rep) || 0, 0), c.passos); m.peso = Math.min(Math.max(parseInt(m.peso) || 3, 1), 5); });
  if (!Array.isArray(c.custom)) c.custom = [];
  if (!Array.isArray(c.ocultas)) c.ocultas = [];
  return c;
}

function migrarModelosAntigos(s) {
  // Traz os modelos salvos pelo gerador original, se existirem
  const mapa = new Map();
  ['Livre', 'Recomendado'].forEach(modo => {
    try {
      const m = JSON.parse(localStorage.getItem('cicloEstudosModeloV2_' + modo));
      if (!m) return;
      (m.materiasCustomizadas || []).forEach(n => { if (!s.config.custom.includes(n)) s.config.custom.push(n); });
      (m.configuracaoMaterias || []).slice(0, parseInt(m.qtdMaterias) || 99).forEach(x => {
        if (!x || !x.nome) return;
        const e = mapa.get(x.nome) || { nome: x.nome, rep: 0, peso: 3 };
        if (modo === 'Livre') e.rep = parseInt(x.peso) || 0; else e.peso = parseInt(x.peso) || 3;
        mapa.set(x.nome, e);
      });
      s.config.passos = parseInt(m.horasTotais) || s.config.passos;
      s.config.modo = m.modo || s.config.modo;
    } catch (e) {}
  });
  s.config.mats = [...mapa.values()];
}

function carregar() {
  const d = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const s = Object.assign(d, p);
      s.config = Object.assign(defaults().config, p.config || {});
      s.pomo = Object.assign(defaults().pomo, p.pomo || {});
      s.backup = Object.assign(defaults().backup, p.backup || {});
      normalizarEstado(s);
      // semanas salvas antes do calendário: deriva a semana real (seg–dom) a partir da data de início
      if (s.semana && !s.semana.seg) { s.semana.seg = segundaDe(s.semana.inicio || hoje()); s.semana.dom = addDias(s.semana.seg, 6); }
      return s;
    }
  } catch (e) {}
  migrarModelosAntigos(d);
  return normalizarEstado(d);
}

let state = carregar();
let storageOk = true;
function persistir() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function salvar() { persistir(); agendarBackup(); renderLateral(); }

// ============================================================
// UTILIDADES
// ============================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = x => Math.round(x * 100) / 100;
const soma = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const fmtData = iso => { const [, m, d] = String(iso).split('-'); return d + '/' + m; };
function fmtH(h) {
  const m = Math.round((h || 0) * 60);
  if (m < 60) return m + 'min';
  return Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0');
}
function cor(nome) {
  if (state.cores[nome] === undefined) {
    const usados = Object.values(state.cores);
    let i = 0; while (usados.includes(i % PALETA.length) && usados.length < PALETA.length) i++;
    state.cores[nome] = i % PALETA.length;
  }
  return PALETA[state.cores[nome]];
}
const todasMaterias = () => [...MATERIAS_PADRAO, ...state.config.custom].filter(m => !state.config.ocultas.includes(m));

// ============================================================
// MODAL
// ============================================================
let modalBotoes = [];
function modal(titulo, html, botoes) {
  $('mt').textContent = titulo;
  $('mb').innerHTML = html;
  modalBotoes = botoes;
  $('ma').innerHTML = botoes.map((b, i) => `<button class="btn ${b.c || ''}" onclick="modalBtn(${i})">${esc(b.t)}</button>`).join('');
  $('modal').hidden = false;
}
function fecharModal() { $('modal').hidden = true; }
function modalBtn(i) { const f = modalBotoes[i].f; fecharModal(); if (f) f(); }
function alerta(titulo, msg) { modal(titulo, `<p>${esc(msg)}</p>`, [{ t: 'OK', c: 'primary' }]); }
function confirmar(msg, fn, rotulo) {
  modal('Confirmação', `<p>${esc(msg)}</p>`, [{ t: 'Cancelar' }, { t: rotulo || 'Sim', c: 'primary', f: fn }]);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) fecharModal(); });

// ============================================================
// TEMA E ABAS
// ============================================================
function aplicarTema() {
  const r = document.documentElement;
  if (state.tema === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', state.tema);
}
function alternarTema() {
  const escuroAgora = state.tema === 'dark' || (state.tema === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  state.tema = escuroAgora ? 'light' : 'dark';
  aplicarTema(); salvar();
}

let abaAtual = 'montar';
let dataRender = hoje();   // data usada no último desenho das telas (detecta a virada do dia)
function showTab(nome) {
  rsFlush();
  abaAtual = nome;
  atualizarAviso();
  renderLateral();
  ['montar', 'semana', 'desempenho', 'resumos', 'flashcards'].forEach(n => { $('view-' + n).hidden = n !== nome; });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === nome));
  if (nome === 'montar') renderMontar();
  if (nome === 'semana') renderSemana();
  if (nome === 'desempenho') renderDesempenho();
  if (nome === 'resumos') renderResumos();
  if (nome === 'flashcards') renderFlashcards();
}

// ============================================================
// LÓGICA DO CICLO (reaproveitada do gerador original)
// ============================================================
function calcularDistribuicao(materias, totalPeso, horasTotais) {
  if (totalPeso === 0 || horasTotais === 0) return [];
  let dist = materias.map(m => {
    const pct = m.peso / totalPeso;
    const reais = horasTotais * pct;
    const arred = Math.round(reais);
    const final = arred > 0 ? arred : 1;
    return { nome: m.nome, peso: m.peso, horas: final, erro: reais - final };
  });
  let diff = horasTotais - soma(dist, d => d.horas);
  while (diff !== 0) {
    if (diff > 0) {
      dist.sort((a, b) => a.erro - b.erro);
      dist[0].horas++; dist[0].erro -= 1; diff--;
    } else {
      dist.sort((a, b) => b.erro - a.erro);
      const alvo = dist.find(d => d.horas > 1);
      if (!alvo) break;
      alvo.horas--; alvo.erro += 1; diff++;
    }
  }
  return dist;
}

function gerarCicloEspacado(materias, totalSlots) {
  const mats = materias.map(m => ({ nome: m.nome, restante: m.peso }));
  const ciclo = [];
  let ultimo = -1, primeira = '';
  while (ciclo.length < totalSlots) {
    let melhor = -1, maior = -Infinity;
    const ultimoSlot = ciclo.length === totalSlots - 1;
    for (let i = 0; i < mats.length; i++) {
      const m = mats[i];
      if (m.restante <= 0) continue;
      let pr = m.restante * 1000 + (i === ultimo ? 0 : 1);
      if (ultimoSlot && primeira && m.nome === primeira) pr -= 20000;
      if (pr > maior) { maior = pr; melhor = i; }
    }
    if (melhor === -1) break;
    if (ciclo.length === 0) primeira = mats[melhor].nome;
    ciclo.push(mats[melhor].nome);
    mats[melhor].restante--;
    ultimo = melhor;
  }
  return ciclo;
}

// ============================================================
// ABA: MONTAR CICLO
// ============================================================
// ----- tamanho do ciclo: meta semanal em horas ÷ duração do passo = nº de passos -----
const snapshotConfig = () => { const c = state.config; return JSON.parse(JSON.stringify({ modo: c.modo, horas: c.horas, duracao: c.duracao, mats: c.mats, dias: c.dias, porDia: c.porDia })); };
// carrega uma montagem salva (modelo ou semana anterior) no formulário, sem gerar a semana
function aplicarSnapshot(m) {
  const c = state.config;
  Object.assign(c, JSON.parse(JSON.stringify(m)));
  c.passos = passosDe(c);
  const conhecidas = todasMaterias().map(x => x.toLowerCase());
  c.mats.forEach(x => { if (!conhecidas.includes(x.nome.toLowerCase())) { if (!c.custom.includes(x.nome)) c.custom.push(x.nome); conhecidas.push(x.nome.toLowerCase()); } });
}
function somaLivre() { return soma(state.config.mats, m => m.rep); }

function renderMontar() {
  const c = state.config, livre = c.modo === 'Livre', passos = c.passos;
  const livres = todasMaterias().filter(m => !c.mats.some(x => x.nome === m));
  const ultima = [...state.fechadas].reverse().find(r => r.modelo);
  const horasEf = round2(passos * c.duracao);

  // quantos passos cada matéria vai ter (prévia)
  const total = soma(c.mats, m => livre ? m.rep : m.peso);
  const prev = {};
  if (livre) c.mats.forEach(m => { prev[m.nome] = m.rep; });
  else if (total && c.mats.length <= passos) calcularDistribuicao(c.mats.map(m => ({ nome: m.nome, peso: m.peso })), total, passos).forEach(d => { prev[d.nome] = d.horas; });

  const rows = c.mats.map((m, i) => `<div class="mrow2">
      <span class="dot" style="background:${cor(m.nome)}"></span>
      <span class="nm" title="${esc(m.nome)}">${esc(m.nome)}</span>
      ${livre ? `<label class="muted" title="Repetições no ciclo">Rep. <input type="number" min="0" max="${passos}" step="1" value="${m.rep}" onchange="cfgRep(${i},this.value)"></label>`
              : `<label class="muted">Peso <select onchange="cfgPeso(${i},this.value)">${[1, 2, 3, 4, 5].map(p => `<option ${p === m.peso ? 'selected' : ''}>${p}</option>`).join('')}</select></label>`}
      <span class="muted prev">${prev[m.nome] != null ? `≈ ${prev[m.nome]} passo(s) · ${fmtH(prev[m.nome] * c.duracao)}` : ''}</span>
      <button class="btn sm" onclick="removerMat(${i})" aria-label="Tirar ${esc(m.nome)} do ciclo" title="Tirar do ciclo">✕</button>
    </div>`).join('');

  let contador = '', podeGerar = c.mats.length > 0;
  if (livre && c.mats.length) {
    const diff = passos - somaLivre();
    podeGerar = diff === 0;
    contador = diff === 0
      ? `<div class="counter ok">Soma correta: ${passos} de ${passos} passos (${fmtH(horasEf)}).</div>`
      : diff > 0 ? `<div class="counter warn">Faltam ${diff} passo(s) para completar o ciclo de ${passos}. <button class="btn sm" onclick="distribuirIgual()">Distribuir igualmente</button></div>`
                 : `<div class="counter bad">Tire ${-diff} passo(s). O total do ciclo é ${passos}. <button class="btn sm" onclick="distribuirIgual()">Distribuir igualmente</button></div>`;
  } else if (!livre && c.mats.length > passos) {
    podeGerar = false;
    contador = `<div class="counter bad">São ${c.mats.length} matérias para ${passos} passos. Aumente a meta de horas ou tire matérias.</div>`;
  }

  const modelosHtml = state.modelos.length ? state.modelos.map(m => `<div class="mdl">
      <div class="t"><b>${esc(m.nome)}</b><div class="muted">${m.config.mats.length} matéria(s) · ${fmtH(passosDe(m.config) * m.config.duracao)} por semana · ${m.config.modo === 'Livre' ? 'Livre' : 'Ponderado'}</div></div>
      <button class="btn sm primary" onclick="usarModelo('${m.id}')">Usar</button>
      <button class="btn sm" onclick="atualizarModelo('${m.id}')" title="Substituir este modelo pela montagem atual">Atualizar</button>
      <button class="btn sm" onclick="renomearModelo('${m.id}')" title="Renomear" aria-label="Renomear modelo">✎</button>
      <button class="btn sm" onclick="excluirModelo('${m.id}')" title="Excluir" aria-label="Excluir modelo">🗑</button></div>`).join('')
    : '<p class="muted" style="margin:10px 0 0">Nenhum modelo salvo ainda.</p>';

  $('view-montar').innerHTML = `
  <div class="card">
    <h2>Modelos de ciclo</h2>
    <p class="muted">Salve a montagem atual para reaproveitar nas próximas semanas. Ao usar um modelo, as matérias voltam preenchidas aqui e você ajusta (tira uma, muda as repetições) antes de gerar.</p>
    <div class="row"><input id="mdNome" placeholder="Nome (ex.: Semana padrão 28h)" style="flex:1;min-width:150px" onkeydown="if(event.key==='Enter')salvarModelo()"><button class="btn primary" onclick="salvarModelo()">💾 Salvar como modelo</button></div>
    ${ultima ? `<button class="btn" style="margin-top:8px" onclick="repetirUltima()">↻ Repetir o ciclo da última semana fechada (${fmtData(ultima.inicio)})</button>` : ''}
    <div style="margin-top:6px">${modelosHtml}</div>
  </div>

  <div class="card">
    <h2>Tamanho do ciclo</h2>
    <div class="grid2">
      <label class="f">Meta semanal (horas)
        <input type="number" min="0.5" step="0.5" value="${c.horas}" onchange="cfgHoras(this.value)">
      </label>
      <label class="f">Duração de cada passo (horas)
        <input type="number" min="0.25" step="0.25" value="${c.duracao}" onchange="cfgDuracao(this.value)">
      </label>
    </div>
    <p class="muted" style="margin-top:8px">${fmtH(c.horas)} ÷ ${fmtH(c.duracao)} = <b>${passos} passos</b>${Math.abs(horasEf - c.horas) > 0.01 ? ` (arredondado: o ciclo terá ${fmtH(horasEf)})` : ''}. A duração de cada passo pode ser ajustada depois, na aba Semana.</p>
    <div style="margin-top:8px"><div class="muted" style="margin-bottom:6px"><b>Tipo de montagem</b></div>
      <div class="seg">
        <button class="${livre ? 'on' : ''}" onclick="cfgModo('Livre')">Ciclo Livre</button>
        <button class="${!livre ? 'on' : ''}" onclick="cfgModo('Recomendado')">Ciclo Ponderado</button>
      </div>
      <p class="muted" style="margin-top:6px">${livre ? 'Livre: você diz quantas vezes cada matéria aparece.' : 'Ponderado: você dá um peso de 1 a 5 e o app divide os passos proporcionalmente.'}</p>
    </div>
  </div>

  <div class="card">
    <h2>Dias de estudo</h2>
    <p class="muted">Hoje é <b>${NOMES_DIA_LONGO[idxDia(hoje())]}, ${fmtData(hoje())}</b>. A semana vai de segunda a domingo e os passos são distribuídos a partir de hoje, só nos dias marcados.</p>
    <div class="chips" style="margin:10px 0">${NOMES_DIA.map((n, i) => `<button class="chip ${c.dias[i] ? 'on' : ''}" onclick="cfgDia(${i})" aria-pressed="${c.dias[i]}">${n}</button>`).join('')}</div>
    <label class="f" style="max-width:260px">Passos por dia (vazio = automático)
      <input type="number" min="1" step="1" value="${c.porDia || ''}" placeholder="automático" onchange="cfgPorDia(this.value)">
    </label>
    <p class="muted" style="margin-top:8px">${previaAgenda()}</p>
  </div>

  <div class="card m-materias">
    <h2>Matérias do ciclo</h2>
    <p class="muted">${livre ? `Defina quantas vezes cada matéria aparece. A soma deve ser ${passos} passos.` : `Dê um peso de 1 a 5; os ${passos} passos serão divididos proporcionalmente.`} Para incluir uma matéria, use o seletor abaixo da lista.</p>
    ${contador}
    <div class="lista-m">
    ${rows || '<p class="muted">Nenhuma matéria no ciclo ainda. Use o seletor abaixo para adicionar.</p>'}
    <select id="addMat" onchange="addMatSelect(this.value)" aria-label="Adicionar matéria" style="width:100%;margin-top:6px">
      <option value="">＋ Adicionar matéria ao ciclo…</option>
      ${livres.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
      <option value="__nova">✏️ Digitar uma matéria nova…</option>
    </select>
    <button class="btn sm" style="margin-top:8px" onclick="abrirGerenciarMaterias()">⚙ Gerenciar lista de matérias</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" ${podeGerar ? '' : 'disabled'} onclick="gerar()">Gerar ciclo e abrir a semana</button>
      <button class="btn danger" onclick="resetPadrao()">Voltar ao padrão</button>
    </div>
  </div>`;
}

// ----- modelos de ciclo -----
function salvarModelo() {
  const c = state.config;
  if (!c.mats.length) { alerta('Modelo', 'Adicione ao menos uma matéria ao ciclo antes de salvar como modelo.'); return; }
  const nome = $('mdNome').value.trim() || `Modelo ${state.modelos.length + 1}`;
  const gravar = () => {
    const ex = state.modelos.find(m => m.nome.toLowerCase() === nome.toLowerCase());
    if (ex) { ex.config = snapshotConfig(); } else state.modelos.push({ id: novoId(), nome, criado: Date.now(), config: snapshotConfig() });
    salvar(); renderMontar();
  };
  if (state.modelos.some(m => m.nome.toLowerCase() === nome.toLowerCase())) confirmar(`Já existe um modelo chamado "${nome}". Substituí-lo pela montagem atual?`, gravar, 'Substituir');
  else gravar();
}
function usarModelo(id) {
  const m = state.modelos.find(x => x.id === id);
  const aplicar = () => { aplicarSnapshot(m.config); salvar(); renderMontar(); };
  if (state.config.mats.length) confirmar(`Carregar o modelo "${m.nome}" substitui a montagem atual (matérias, meta e dias). Os modelos salvos não mudam. Continuar?`, aplicar, 'Carregar');
  else aplicar();
}
function atualizarModelo(id) {
  const m = state.modelos.find(x => x.id === id);
  if (!state.config.mats.length) { alerta('Modelo', 'A montagem atual está vazia.'); return; }
  confirmar(`Substituir o conteúdo do modelo "${m.nome}" pela montagem atual?`, () => { m.config = snapshotConfig(); salvar(); renderMontar(); }, 'Atualizar');
}
function renomearModelo(id) {
  const m = state.modelos.find(x => x.id === id);
  modal('Renomear modelo', `<label class="f">Nome<input id="mdNovoNome" value="${esc(m.nome)}"></label>`, [{ t: 'Cancelar' }, { t: 'Salvar', c: 'primary', f: () => {
    const n = $('mdNovoNome').value.trim();
    if (n) { m.nome = n; salvar(); renderMontar(); }
  } }]);
}
function excluirModelo(id) {
  const m = state.modelos.find(x => x.id === id);
  confirmar(`Excluir o modelo "${m.nome}"? As semanas já geradas não mudam.`, () => { state.modelos = state.modelos.filter(x => x.id !== id); salvar(); renderMontar(); }, 'Excluir');
}
function repetirUltima() {
  const r = [...state.fechadas].reverse().find(x => x.modelo);
  if (r) repetirDoHistorico(r.id);
}
function repetirDoHistorico(id) {
  const r = state.fechadas.find(x => x.id === id);
  if (!r || !r.modelo) return;
  const aplicar = () => { aplicarSnapshot(r.modelo); salvar(); showTab('montar'); };
  if (state.config.mats.length && abaAtual === 'montar') confirmar('Carregar o ciclo dessa semana substitui a montagem atual. Continuar?', aplicar, 'Carregar');
  else aplicar();
}

function cfgHoras(v) {
  const n = parseFloat(v), c = state.config;
  if (n > 0) c.horas = n;
  sincronizarPassos(); salvar(); renderMontar();
}
function cfgDuracao(v) {
  const n = parseFloat(v), c = state.config;
  c.duracao = n > 0 ? n : 1;
  sincronizarPassos(); salvar(); renderMontar();
}
// recalcula o nº de passos e mantém as repetições dentro do limite
function sincronizarPassos() {
  const c = state.config;
  c.passos = passosDe(c);
  c.mats.forEach(m => { if (m.rep > c.passos) m.rep = c.passos; });
}
function cfgDia(i) {
  const c = state.config;
  if (c.dias[i] && c.dias.filter(Boolean).length === 1) { alerta('Aviso', 'Mantenha ao menos um dia de estudo marcado.'); return; }
  c.dias[i] = !c.dias[i]; salvar(); renderMontar();
}
function cfgPorDia(v) { const n = parseInt(v); state.config.porDia = n > 0 ? n : null; salvar(); renderMontar(); }

// ----- calendário: semana real (seg–dom) e distribuição dos passos pelos dias -----
// Semana alvo: a atual, se ainda houver dia de estudo de hoje em diante; senão a próxima.
function semanaAlvo() {
  let seg = segundaDe(hoje());
  if (!diasDisponiveis(seg).length) seg = addDias(seg, 7);
  return seg;
}
function diasDisponiveis(seg) {
  const out = [], h = hoje();
  for (let i = 0; i < 7; i++) { const d = addDias(seg, i); if (state.config.dias[i] && d >= h) out.push(d); }
  return out;
}
function porDiaEf(n, nDias) { return state.config.porDia > 0 ? state.config.porDia : Math.max(1, Math.ceil(n / Math.max(1, nDias))); }
// Atribui .dia aos passos informados, em ordem, a partir de hoje; o que não couber fica sem dia (null)
function agendar(passos, seg) {
  const dias = diasDisponiveis(seg), cap = porDiaEf(passos.length, dias.length);
  passos.forEach((p, i) => { p.dia = dias[Math.floor(i / cap)] || null; });
}
function previaAgenda() {
  const seg = semanaAlvo(), dias = diasDisponiveis(seg), n = state.config.passos;
  const cap = porDiaEf(n, dias.length), cabem = cap * dias.length;
  let t = `Semana ${fmtData(seg)} → ${fmtData(addDias(seg, 6))}${seg > segundaDe(hoje()) ? ' (próxima, pois não há mais dia de estudo nesta)' : ''} · ${dias.length} dia(s) de estudo disponíveis · ${cap} passo(s) por dia.`;
  if (cabem < n) t += ` ⚠️ Só cabem ${cabem} dos ${n} passos; ${n - cabem} ficarão sem dia.`;
  return t;
}

function cfgModo(m) { state.config.modo = m; salvar(); renderMontar(); }
function cfgRep(i, v) { const c = state.config, n = parseInt(v); c.mats[i].rep = n >= 0 ? Math.min(n, c.passos) : 0; salvar(); renderMontar(); }
function cfgPeso(i, v) { state.config.mats[i].peso = parseInt(v) || 3; salvar(); renderMontar(); }
function removerMat(i) { state.config.mats.splice(i, 1); salvar(); renderMontar(); }
function distribuirIgual() {
  const c = state.config, n = c.mats.length;
  if (!n) return;
  const base = Math.floor(c.passos / n), extra = c.passos % n;
  c.mats.forEach((m, i) => { m.rep = base + (i < extra ? 1 : 0); });
  salvar(); renderMontar();
}
// um seletor para tudo: escolhe uma matéria da lista ou digita uma nova
function addMatSelect(v) {
  if (!v) return;
  if (v === '__nova') { abrirNovaMateria(); $('addMat').value = ''; return; }
  const c = state.config;
  if (!c.mats.some(x => x.nome === v)) c.mats.push({ nome: v, rep: 1, peso: 3 });
  salvar(); renderMontar();
}
// tirar (ou trazer de volta) matérias da lista de escolha, sem apagar notas, questões ou semanas que usam o nome
function abrirGerenciarMaterias() {
  const c = state.config, lista = todasMaterias();
  modal('Lista de matérias', `<p class="muted">São estas as matérias que aparecem para escolher no app. Tirar uma matéria da lista a remove também do ciclo que está sendo montado, mas não apaga notas, questões ou semanas que já usam o nome dela.</p>
    <div>${lista.map(m => `<div class="reg"><span class="dot" style="background:${cor(m)}"></span><span class="t">${esc(m)}</span><button class="btn sm danger" data-m="${esc(m)}" onclick="tirarMateria(this.dataset.m)">Tirar da lista</button></div>`).join('') || '<p class="muted">A lista está vazia.</p>'}</div>
    ${c.ocultas.length ? `<h3 style="margin-top:14px">Tiradas da lista</h3>${c.ocultas.map(m => `<div class="reg"><span class="t">${esc(m)}</span><button class="btn sm" data-m="${esc(m)}" onclick="trazerMateria(this.dataset.m)">Trazer de volta</button></div>`).join('')}` : ''}
    <p class="muted" style="margin-top:10px">Para incluir uma matéria nova, use "Digitar uma matéria nova…" no seletor.</p>`,
    [{ t: 'Fechar', c: 'primary' }]);
}
function tirarMateria(nome) {
  const c = state.config;
  if (!c.ocultas.includes(nome)) c.ocultas.push(nome);
  c.mats = c.mats.filter(m => m.nome !== nome);
  salvar(); renderMontar(); abrirGerenciarMaterias();
}
function trazerMateria(nome) {
  const c = state.config;
  c.ocultas = c.ocultas.filter(m => m !== nome);
  salvar(); renderMontar(); abrirGerenciarMaterias();
}
function abrirNovaMateria() {
  modal('Nova matéria', `<label class="f">Nome (várias, separadas por vírgula)<input id="novaMat" placeholder="Ex.: Legislação Específica, Inglês"></label>
    <p class="muted" style="margin-top:8px">A matéria nova fica na lista para usar nas próximas semanas e já entra neste ciclo.</p>`,
    [{ t: 'Cancelar' }, { t: 'Adicionar', c: 'primary', f: () => {
      const c = state.config, nomes = $('novaMat').value.split(',').map(s => s.trim()).filter(Boolean);
      if (!nomes.length) return;
      nomes.forEach(n => {
        const ex = todasMaterias().find(m => m.toLowerCase() === n.toLowerCase()), nome = ex || n;
        if (!ex) c.custom.push(n);
        if (!c.mats.some(x => x.nome === nome)) c.mats.push({ nome, rep: 1, peso: 3 });
      });
      salvar(); renderMontar();
    } }]);
  setTimeout(() => { const i = $('novaMat'); if (i) i.focus(); }, 0);
}

function resetPadrao() {
  confirmar('Voltar ao padrão apaga as matérias adicionadas e a configuração atual do ciclo. A semana em andamento e o histórico não são afetados. Continuar?', () => {
    state.config = migrarConfig(defaults().config); salvar(); renderMontar();
  });
}

function temProgresso() {
  const s = state.semana;
  return !!s && s.passos.some(p => p.feito || p.horasFeitas > 0);
}

function gerar() {
  const c = state.config, livre = c.modo === 'Livre';
  if (!c.mats.length) { alerta('Erro de configuração', 'Adicione ao menos uma matéria ao ciclo.'); return; }
  const mats = c.mats.map(m => ({ nome: m.nome, peso: livre ? m.rep : m.peso })).filter(m => m.peso > 0);
  const total = soma(mats, m => m.peso);
  if (!total) { alerta('Erro de configuração', livre ? 'Defina as repetições de ao menos uma matéria.' : 'Defina o peso de ao menos uma matéria.'); return; }
  if (livre && total !== c.passos) { alerta('Erro de soma', `A soma das repetições (${total}) deve ser igual a ${c.passos} passos.`); return; }
  if (!livre && mats.length > c.passos) { alerta('Erro de configuração', `São ${mats.length} matérias para ${c.passos} passos. Aumente a meta de horas ou tire matérias.`); return; }

  const construir = () => {
    const lista = livre
      ? gerarCicloEspacado(mats, total)
      : gerarCicloEspacado(calcularDistribuicao(mats, total, c.passos).map(d => ({ nome: d.nome, peso: d.horas })), c.passos);
    const seg = semanaAlvo();
    state.semana = {
      id: Date.now(), inicio: hoje(), seg, dom: addDias(seg, 6), meta: null, pomodoros: 0,
      modelo: snapshotConfig(),      // guarda a montagem usada, para "repetir este ciclo" depois
      passos: lista.map((nome, i) => ({ id: i + 1, materia: nome, dia: null, horasPlanejadas: c.duracao, horasFeitas: 0, feito: false, nota: '' }))
    };
    lista.forEach(cor);
    agendar(state.semana.passos, seg);
    const semDia = state.semana.passos.filter(p => !p.dia).length;
    salvar(); showTab('semana');
    if (semDia) alerta('Passos sem dia', `${semDia} passo(s) não couberam nos dias de estudo restantes da semana e ficaram em "Sem dia". Aumente os "passos por dia", marque mais dias ou mova-os manualmente.`);
  };
  if (temProgresso()) confirmar('Já existe uma semana com marcações. Gerar um novo ciclo substitui a semana atual sem salvar estatísticas. Continuar?', construir);
  else if (state.semana) confirmar('Gerar um novo ciclo substitui a semana atual. Continuar?', construir);
  else construir();
}

// ============================================================
// ABA: SEMANA
// ============================================================
const metaEf = s => s.meta != null ? s.meta : round2(soma(s.passos, p => p.horasPlanejadas));
const horasFeitas = s => round2(soma(s.passos, p => p.horasFeitas));

function renderSemana() {
  const s = state.semana, v = $('view-semana');
  if (!s) {
    v.innerHTML = `<div class="card empty"><h2>Nenhuma semana em andamento</h2>
      <p class="muted">Monte um ciclo para começar a acompanhar a semana.</p>
      <button class="btn primary" onclick="showTab('montar')">Montar ciclo</button></div>`;
    return;
  }
  const n = s.passos.length, feitos = s.passos.filter(p => p.feito).length;
  const horas = horasFeitas(s), meta = metaEf(s), falta = Math.max(0, round2(meta - horas));
  const pctP = n ? Math.round(feitos / n * 100) : 0;
  const pctH = meta ? Math.min(100, Math.round(horas / meta * 100)) : 0;

  const h0 = hoje();
  dataRender = h0;
  const optDia = p => `<option value="">Sem dia</option>` + Array.from({ length: 7 }, (_, i) => {
    const d = addDias(s.seg, i);
    return `<option value="${d}" ${p.dia === d ? 'selected' : ''}>${NOMES_DIA[i]} ${fmtData(d)}</option>`;
  }).join('');
  const linhaPasso = p => `
    <div class="passo ${p.feito ? 'done' : ''}">
      <input type="checkbox" ${p.feito ? 'checked' : ''} onchange="togglePasso(${p.id},this.checked)" aria-label="Concluir passo ${p.id}">
      <div style="min-width:0"><div class="nome"><span class="num">${p.id}.</span><span class="dot" style="background:${cor(p.materia)}"></span>${esc(p.materia)}</div>
        <div class="bar sm"><i style="width:${p.horasPlanejadas ? Math.min(100, Math.round(p.horasFeitas / p.horasPlanejadas * 100)) : 0}%;background:${cor(p.materia)}"></i></div></div>
      <div><span class="cap">planejado (h)</span><input class="h" type="number" min="0.25" step="0.25" value="${p.horasPlanejadas}" onchange="setPlan(${p.id},this.value)"></div>
      <div class="feito-col"><span class="cap">feito (h)</span><input class="h" type="number" min="0" step="0.25" value="${p.horasFeitas}" onchange="setFeito(${p.id},this.value)"></div>
      <div class="sub">
        <input class="nota" placeholder="Anotação: tópico, questões, acertos…" value="${esc(p.nota)}" onchange="setNota(${p.id},this.value)">
        <select class="dia" onchange="setDia(${p.id},this.value)" aria-label="Dia do passo ${p.id}">${optDia(p)}</select>
        <button class="btn sm" onclick="abrirResumoMateria(${p.id})" title="Abrir ou criar o resumo desta matéria">📝 Resumo</button>
      </div>
    </div>`;
  const grupo = (titulo, itens, dia) => {
    const fe = itens.filter(p => p.feito).length, pend = itens.length - fe;
    const hp = soma(itens, p => p.horasPlanejadas), hf = soma(itens, p => p.horasFeitas);
    const badges = (dia === h0 ? '<span class="badge hoje">HOJE</span>' : '') +
      (dia && dia < h0 && pend > 0 ? `<span class="badge atraso">${pend} atrasado(s)</span>` : '');
    return `<div class="dia-h" ${dia ? `id="dia-${dia}"` : ''}><b>${titulo}</b>${badges}<span class="muted">${fe}/${itens.length} passos · ${fmtH(hf)}/${fmtH(hp)}</span></div>${itens.map(linhaPasso).join('')}`;
  };
  const semDiaItens = s.passos.filter(p => !p.dia || p.dia < s.seg || p.dia > s.dom);
  const grupos = [];
  for (let i = 0; i < 7; i++) {
    const d = addDias(s.seg, i), itens = s.passos.filter(p => p.dia === d);
    if (itens.length) grupos.push(grupo(`${NOMES_DIA_LONGO[i]} ${fmtData(d)}`, itens, d));
  }
  if (semDiaItens.length) grupos.push(grupo(grupos.length ? 'Sem dia' : 'Passos', semDiaItens, null));
  const linhas = grupos.join('');
  const passosHoje = s.passos.filter(p => p.dia === h0);
  const hojeFeitos = passosHoje.filter(p => p.feito).length;
  const fora = h0 > s.dom ? ' · ⚠️ semana encerrada' : h0 < s.seg ? ' · semana futura' : '';

  const ordem = [...new Set(s.passos.map(p => p.materia))];
  const porMat = ordem.map(m => {
    const pl = soma(s.passos.filter(p => p.materia === m), p => p.horasPlanejadas);
    const fe = soma(s.passos.filter(p => p.materia === m), p => p.horasFeitas);
    const w = pl ? Math.min(100, fe / pl * 100) : 0;
    return `<div class="mat"><span class="dot" style="background:${cor(m)}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(m)}">${esc(m)}</span>
      <span class="muted">${fmtH(fe)}/${fmtH(pl)}</span></div>
      <div class="bar" style="margin:-4px 0 10px"><i style="width:${w}%;background:${cor(m)}"></i></div>`;
  }).join('');

  const tira = Array.from({ length: 7 }, (_, i) => {
    const d = addDias(s.seg, i), it = s.passos.filter(p => p.dia === d), fe = it.filter(p => p.feito).length;
    const folga = !state.config.dias[i] && !it.length, w = it.length ? Math.round(fe / it.length * 100) : 0;
    return `<button class="wd ${d === h0 ? 'hoje' : ''} ${folga ? 'folga' : ''}" onclick="irParaDia('${d}')" title="Ir para ${NOMES_DIA_LONGO[i]}">
      <span class="n">${NOMES_DIA[i]}</span><span class="dt">${fmtData(d)}</span><b>${it.length ? fe + '/' + it.length : folga ? 'folga' : '—'}</b><div class="bar"><i style="width:${w}%"></i></div></button>`;
  }).join('');
  v.innerHTML = `
  <div class="hojebar">📅 Hoje: ${NOMES_DIA_LONGO[idxDia(h0)]}, ${fmtData(h0)}<span class="muted">· Semana ${fmtData(s.seg)} → ${fmtData(s.dom)}${fora}</span></div>
  <div class="card">
    <div class="stats">
      <div class="stat"><span class="muted">Hoje</span><b>${passosHoje.length ? hojeFeitos + '/' + passosHoje.length : '—'}</b><span class="muted">${passosHoje.length ? 'passos do dia' : 'sem passos hoje'}</span></div>
      <div class="stat"><span class="muted">Passos</span><b>${feitos}/${n}</b><div class="bar"><i style="width:${pctP}%"></i></div></div>
      <div class="stat"><span class="muted">Horas estudadas</span><b>${fmtH(horas)}</b><div class="bar"><i style="width:${pctH}%"></i></div></div>
      <div class="stat"><span class="muted">Meta da semana (h)</span>
        <input type="number" min="0" step="0.5" value="${meta}" style="width:100px" onchange="setMeta(this.value)"></div>
      <div class="stat"><span class="muted">Faltam</span><b>${fmtH(falta)}</b></div>
    </div>
  </div>
  <div class="weekstrip">${tira}</div>
  <div class="layout">
    <div class="col-l">
      <div class="card lista-card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0">Ciclo da semana <span class="muted">· início ${fmtData(s.inicio)}</span></h2>
          <span class="row"><button class="btn sm" onclick="copiarCiclo()">📋 Copiar lista</button><span id="okCopia" class="muted" hidden>Copiado!</span></span>
        </div>
        <div class="scroll">${linhas}</div>
      </div>
      <div class="row acoes">
        <button class="btn primary" onclick="fecharSemana()">✅ Fechar semana</button>
        <button class="btn" onclick="reagendar()">📅 Reagendar pendentes a partir de hoje</button>
        <button class="btn danger" onclick="limparSemana()">Limpar marcações sem salvar</button>
      </div>
    </div>
    <div class="col-r">
      <div class="card"><h2>Ciclo</h2>${roscaCiclo(s)}</div>
      <div class="card"><h2>Por matéria</h2>${porMat}</div>
    </div>
  </div>`;
}

const achar = id => state.semana.passos.find(p => p.id === id);
function togglePasso(id, v) {
  const p = achar(id); p.feito = v;
  if (v && p.horasFeitas === 0) p.horasFeitas = p.horasPlanejadas;
  salvar(); renderSemana();
}
function setPlan(id, v) { const n = parseFloat(v); achar(id).horasPlanejadas = n > 0 ? n : 1; salvar(); renderSemana(); }
function setFeito(id, v) { const n = parseFloat(v); achar(id).horasFeitas = n > 0 ? n : 0; salvar(); renderSemana(); }
function setNota(id, v) { achar(id).nota = v; salvar(); }
function setDia(id, v) { achar(id).dia = v || null; salvar(); renderSemana(); }
function reagendar() {
  confirmar('Os passos ainda não concluídos serão redistribuídos a partir de hoje, nos seus dias de estudo, e os dias que você ajustou à mão nesses passos serão sobrescritos. Continuar?', () => {
    const s = state.semana, pend = s.passos.filter(p => !p.feito);
    agendar(pend, s.seg);
    const semDia = pend.filter(p => !p.dia).length;
    salvar(); renderSemana();
    if (semDia) alerta('Passos sem dia', `${semDia} passo(s) não couberam nos dias restantes desta semana e ficaram em "Sem dia".`);
  }, 'Reagendar');
}
function setMeta(v) { const n = parseFloat(v); state.semana.meta = n >= 0 ? n : null; salvar(); renderSemana(); }

function copiarCiclo() {
  const txt = state.semana.passos.map((p, i) => `${i + 1}. ${p.materia}`).join('\n');
  const ok = () => { const e = $('okCopia'); if (e) { e.hidden = false; setTimeout(() => e.hidden = true, 1800); } };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
}

function limparMarcacoes() {
  state.semana.passos.forEach(p => { p.feito = false; p.horasFeitas = 0; p.nota = ''; });
  state.semana.pomodoros = 0;
  // nova rodada: semana real da data de hoje, com os passos redistribuídos a partir de hoje
  const seg = semanaAlvo();
  Object.assign(state.semana, { id: Date.now(), inicio: hoje(), seg, dom: addDias(seg, 6) });
  agendar(state.semana.passos, seg);
}
function limparSemana() {
  confirmar('Isso zera as marcações, horas e anotações da semana SEM salvar estatísticas. Para guardar o resultado, use "Fechar semana". Continuar?', () => {
    limparMarcacoes(); salvar(); renderSemana();
  }, 'Limpar');
}

// ----- resumo / fechamento -----
function resumo(s) {
  const n = s.passos.length, feitos = s.passos.filter(p => p.feito).length;
  const horas = horasFeitas(s), meta = metaEf(s);
  const porMateria = {};
  s.passos.forEach(p => { if (p.horasFeitas > 0) porMateria[p.materia] = round2((porMateria[p.materia] || 0) + p.horasFeitas); });
  return {
    id: Date.now(), inicio: s.seg || s.inicio, fim: s.dom || hoje(),
    cicloFechado: n > 0 && feitos === n, passosFeitos: feitos, passosTotal: n,
    pctConcluido: n ? Math.round(feitos / n * 100) : 0,
    horasEstudadas: horas, metaHoras: meta, horasFaltando: Math.max(0, round2(meta - horas)),
    porMateria, pomodoros: s.pomodoros || 0, modelo: s.modelo || null
  };
}

function pieSVG(porMateria) {
  const dados = Object.entries(porMateria).map(([nome, valor]) => ({ nome, valor })).filter(d => d.valor > 0).sort((a, b) => b.valor - a.valor);
  const total = soma(dados, d => d.valor);
  if (!total) return '<p class="muted" style="text-align:center">Nenhuma hora registrada nesta semana.</p>';
  const R = 80, C = 90;
  let fatias = '', a0 = -Math.PI / 2;
  if (dados.length === 1) {
    fatias = `<circle cx="${C}" cy="${C}" r="${R}" fill="${cor(dados[0].nome)}"/>`;
  } else {
    dados.forEach(d => {
      const ang = d.valor / total * Math.PI * 2, a1 = a0 + ang;
      const x0 = C + R * Math.cos(a0), y0 = C + R * Math.sin(a0), x1 = C + R * Math.cos(a1), y1 = C + R * Math.sin(a1);
      fatias += `<path d="M${C} ${C} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${ang > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${cor(d.nome)}" stroke="var(--card)" stroke-width="2"><title>${esc(d.nome)}: ${fmtH(d.valor)}</title></path>`;
      a0 = a1;
    });
  }
  const leg = dados.map(d => `<div><span class="dot" style="background:${cor(d.nome)}"></span><span style="flex:1">${esc(d.nome)}</span><b>${fmtH(d.valor)}</b><span class="muted">${Math.round(d.valor / total * 100)}%</span></div>`).join('');
  return `<div class="pie"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Horas por matéria">${fatias}</svg><div class="legend">${leg}</div></div>`;
}

function resumoHTML(r) {
  return `<div class="stats" style="margin-bottom:14px">
    <div class="stat"><span class="muted">Ciclo</span><b>${r.cicloFechado ? '✅ Fechado' : '⏳ Incompleto'}</b></div>
    <div class="stat"><span class="muted">Concluído</span><b>${r.pctConcluido}%</b><span class="muted">${r.passosFeitos}/${r.passosTotal} passos</span></div>
    <div class="stat"><span class="muted">Estudado</span><b>${fmtH(r.horasEstudadas)}</b><span class="muted">meta ${fmtH(r.metaHoras)}</span></div>
    <div class="stat"><span class="muted">Faltaram</span><b>${fmtH(r.horasFaltando)}</b>${r.pomodoros ? `<span class="muted">🍅 ${r.pomodoros} pomodoro(s)</span>` : ''}</div>
  </div>${pieSVG(r.porMateria)}`;
}

function fecharSemana() {
  const s = state.semana, r = resumo(s);
  const encerrar = (novoCiclo) => {
    state.fechadas.push(r);
    if (novoCiclo) { if (s.modelo) aplicarSnapshot(s.modelo); state.semana = null; salvar(); showTab('montar'); }
    else { limparMarcacoes(); salvar(); showTab('semana'); }
  };
  modal('Fechar semana', resumoHTML(r), [
    { t: 'Cancelar' },
    { t: 'Salvar e montar a próxima semana', f: () => encerrar(true) },
    { t: 'Salvar e limpar marcações', c: 'primary', f: () => encerrar(false) }
  ]);
}

// ============================================================
// POMODORO
// ============================================================
const P = { fase: 'foco', rodando: false, fim: 0, resta: state.pomo.foco * 60, sessoes: 0, tick: null };
const pomoDur = f => (f === 'foco' ? state.pomo.foco : f === 'pausa' ? state.pomo.pausa : state.pomo.longa) * 60;
const NOMES_FASE = { foco: '🍅 Foco', pausa: '☕ Pausa', longa: '🌴 Pausa longa' };

function setPomo(k, v) {
  const n = parseInt(v); if (!(n > 0)) return;
  state.pomo[k] = n; salvar();
  if (!P.rodando) { P.resta = pomoDur(P.fase); updatePomoUI(); }
}
function fmtMMSS(sec) { return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
function updatePomoUI() {
  if (!$('pomoTempo')) return;
  $('pomoFase').textContent = NOMES_FASE[P.fase];
  $('pomoTempo').textContent = fmtMMSS(P.resta);
  $('pomoBtn').textContent = P.rodando ? '⏸ Pausar' : '▶ Iniciar';
  $('pomoEncerrar').hidden = P.fase !== 'foco';
  $('pomoSessoes').textContent = `Focos concluídos nesta sessão: ${P.sessoes}`;
}
function atualizarTitulo() {
  document.title = P.rodando ? `(${fmtMMSS(P.resta)}) ${NOMES_FASE[P.fase]}` : 'Ciclo de Estudos';
}
function pomoToggle() {
  if (P.rodando) {
    clearInterval(P.tick); P.resta = Math.max(0, Math.round((P.fim - Date.now()) / 1000)); P.rodando = false;
  } else {
    P.fim = Date.now() + P.resta * 1000; P.rodando = true; P.tick = setInterval(pomoTick, 250);
  }
  updatePomoUI(); atualizarTitulo();
}
function pomoTick() {
  P.resta = Math.max(0, Math.ceil((P.fim - Date.now()) / 1000));
  if (P.resta <= 0) { pomoTerminou(); return; }
  updatePomoUI(); atualizarTitulo();
}
function pomoReset() {
  clearInterval(P.tick); P.rodando = false; P.resta = pomoDur(P.fase); updatePomoUI(); atualizarTitulo();
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.3, 0.6].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.15, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.25);
    });
  } catch (e) {}
}
function proximaFase(concluiuFoco) {
  clearInterval(P.tick); P.rodando = false;
  if (concluiuFoco) {
    P.sessoes++;
    P.fase = P.sessoes % state.pomo.ate === 0 ? 'longa' : 'pausa';
  } else P.fase = 'foco';
  P.resta = pomoDur(P.fase);
  updatePomoUI(); atualizarTitulo();
}
function pomoTerminou() {
  const eraFoco = P.fase === 'foco', min = state.pomo.foco;
  beep();
  proximaFase(eraFoco);
  if (eraFoco) { if (state.semana) state.semana.pomodoros = (state.semana.pomodoros || 0) + 1; salvar(); registrarTempo(min); }
}
function pomoEncerrar() {
  if (P.fase !== 'foco') return;
  const decorrido = P.rodando ? pomoDur('foco') - Math.max(0, Math.ceil((P.fim - Date.now()) / 1000)) : pomoDur('foco') - P.resta;
  const min = Math.round(decorrido / 60);
  proximaFase(min >= 1);
  if (min >= 1) { registrarTempo(min); } else { pomoReset(); }
}

// Pergunta a qual passo somar o tempo do foco
function registrarTempo(min) {
  const s = state.semana;
  if (!s) return;
  const h = hoje();
  const pend = s.passos.filter(p => !p.feito).sort((a, b) => (b.dia === h) - (a.dia === h)), resto = s.passos.filter(p => p.feito);
  const op = [...pend, ...resto].map(p => `<option value="${p.id}">${p.id}. ${esc(p.materia)}${p.feito ? ' (feito)' : ''}</option>`).join('');
  modal(`Foco concluído: ${min} min`,
    `<p>A qual passo somar esse tempo?</p>
     <label class="f"><select id="regPasso" onchange="regAtualizarAssuntos()">${op}<option value="0">Não somar a nenhum passo</option></select></label>
     <div class="grid2" style="margin-top:10px">
       <label class="f">Tipo de estudo<select id="regTipo"><option>Teoria</option><option>Questões</option><option>Revisão</option></select></label>
       <label class="f">Assunto (opcional)<select id="regAssunto"></select></label>
     </div>
     <label class="f" style="margin-top:10px"><span><input type="checkbox" id="regFeito"> Marcar o passo como concluído</span></label>`,
    [{ t: 'Pular' }, { t: 'Somar', c: 'primary', f: () => {
      const id = parseInt($('regPasso').value);
      if (id) {
        const p = achar(id);
        p.horasFeitas = round2(p.horasFeitas + min / 60);
        if ($('regFeito').checked) p.feito = true;
        state.sessoes.push({ id: novoId(), data: hoje(), materia: p.materia, assuntoId: $('regAssunto').value || null, minutos: min, tipo: $('regTipo').value });
        salvar();
        if (abaAtual === 'semana') renderSemana();
        if (abaAtual === 'desempenho') renderDesempenho();
      }
    } }]);
  regAtualizarAssuntos();
}
// preenche o seletor de assunto com os assuntos da matéria do passo escolhido
function regAtualizarAssuntos() {
  const sel = $('regAssunto'), id = parseInt($('regPasso').value);
  if (!sel) return;
  const p = id && state.semana ? achar(id) : null;
  const lista = p ? state.assuntos.filter(a => a.materia === p.materia) : [];
  sel.innerHTML = '<option value="">— sem assunto —</option>' + lista.map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('');
}

function verSemana(id) {
  const r = state.fechadas.find(x => x.id === id);
  if (r) modal(`Semana ${fmtData(r.inicio)} → ${fmtData(r.fim)}`, resumoHTML(r), [{ t: 'Fechar', c: 'primary' }]);
}
// ============================================================
// SEMANAS FECHADAS (visão "Semanas" da aba Desempenho)
// ============================================================
function renderSemanasFechadas() {
  const v = $('view-desempenho'), f = state.fechadas;
  v.classList.add('vis-semanas');
  const fech = f.filter(r => r.cicloFechado).length;
  const horas = round2(soma(f, r => r.horasEstudadas));
  const media = f.length ? Math.round(soma(f, r => r.pctConcluido) / f.length) : 0;
  let grafico = '<p class="muted">O gráfico aparece quando você fechar a primeira semana.</p>';
  if (f.length) {
    const ult = f.slice(-12), W = 640, H = 200, pad = 28, bw = Math.min(40, (W - pad * 2) / ult.length - 8);
    const maxV = Math.max(1, ...ult.map(r => Math.max(r.horasEstudadas, r.metaHoras)));
    const passo = (W - pad * 2) / ult.length;
    const barras = ult.map((r, i) => {
      const x = pad + i * passo + (passo - bw) / 2, h = r.horasEstudadas / maxV * (H - pad * 2), y = H - pad - h;
      const ym = H - pad - r.metaHoras / maxV * (H - pad * 2);
      return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 0)}" rx="4" fill="${r.cicloFechado ? 'var(--ok)' : 'var(--accent)'}"><title>${fmtData(r.inicio)}–${fmtData(r.fim)}: ${fmtH(r.horasEstudadas)} de ${fmtH(r.metaHoras)}</title></rect>
        <line x1="${x - 4}" x2="${x + bw + 4}" y1="${ym}" y2="${ym}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtData(r.inicio)}</text>
        <text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="var(--text)">${round2(r.horasEstudadas)}</text>`;
    }).join('');
    grafico = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Horas estudadas por semana">${barras}
      <line x1="${pad}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)"/></svg>
      <p class="muted" style="margin:6px 0 0">Barras verdes: ciclo fechado · da cor do destaque: incompleto · tracejado: meta da semana</p>`;
  }
  const lista = f.length ? [...f].reverse().map(r => `
    <div class="hist">
      <div style="flex:1;min-width:180px"><b>${fmtData(r.inicio)} → ${fmtData(r.fim)}</b>
        <div class="muted">${fmtH(r.horasEstudadas)} de ${fmtH(r.metaHoras)} · faltaram ${fmtH(r.horasFaltando)} · ${r.pctConcluido}% (${r.passosFeitos}/${r.passosTotal})${r.pomodoros ? ' · 🍅 ' + r.pomodoros : ''}</div></div>

function importar(inp) {
  const arq = inp.files[0]; inp.value = '';
  if (!arq) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.fechadas) || !d.config) throw new Error('formato');
      confirmar('Importar substitui TODOS os dados atuais (ciclo, semana e histórico) pelos do arquivo. Continuar?', () => {
        const base = defaults(), bkLocal = state.backup;
        state = Object.assign(base, d);

  rd.readAsText(arq);
}

const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const desesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');

// ----- Markdown -> HTML (próprio, sem bibliotecas) -----
function inl(s) {
  const cods = [];
  let t = esc(s).replace(/`([^`]+)`/g, (m, c) => { cods.push(c); return '\u0000' + (cods.length - 1) + '\u0000'; });
  t = t.replace(/\[\[([^\]]+)\]\]/g, (m, n) =>
    `<a href="#" class="wiki ${notaPorTitulo(desesc(n)) ? '' : 'novo'}" data-t="${n.trim()}" onclick="abrirWiki(this.dataset.t);return false">${n}</a>`);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>').replace(/~~(.+?)~~/g, '<s>$1</s>');
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${cods[i]}</code>`);
}
const LISTRE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
function mdParaHtml(txt, nid) {
  const L = txt.replace(/\r\n?/g, '\n').split('\n'), out = [];
  const comecaBloco = l => /^\s*```/.test(l) || /^#{1,6}\s/.test(l) || LISTRE.test(l) || /^\s*>/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
  let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if (!l.trim()) { i++; continue; }
    let m = l.match(/^(#{1,6})\s+(.*)$/);
    if (m) { out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${mdParaHtml(buf.join('\n'), nid)}</blockquote>`); continue;
    }
    if (l.includes('|') && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1])) {
      const cel = s => s.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const cab = cel(l); i += 2;
      const linhas = [];
      while (i < L.length && L[i].trim() && L[i].includes('|')) linhas.push(cel(L[i++]));
      out.push(`<table><thead><tr>${cab.map(c => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${linhas.map(r => `<tr>${r.map(c => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (LISTRE.test(l)) {
      const itens = [];
      while (i < L.length) {
        const lm = L[i].match(LISTRE);
        if (lm) { itens.push({ indent: lm[1].replace(/\t/g, '  ').length, ord: /\d/.test(lm[2]), texto: lm[3] }); i++; }
        else if (!L[i].trim() && i + 1 < L.length && LISTRE.test(L[i + 1])) i++;
        else break;
      }
      out.push(htmlLista2(itens, nid)); continue;
    }
    const buf = [];
    while (i < L.length && L[i].trim() && !comecaBloco(L[i])) buf.push(L[i++]);
    if (!buf.length) { buf.push(L[i++]); }
    out.push(`<p>${buf.map(l => inl(l)).join('<br>')}</p>`);
  }
  return out.join('\n');
}
function htmlLista2(itens, nid) {
  const raiz = { filhos: [], indent: -1 }, pilha = [raiz];
  itens.forEach(it => {
    while (pilha.length > 1 && it.indent <= pilha[pilha.length - 1].indent) pilha.pop();
    const no = Object.assign({ filhos: [] }, it);
    pilha[pilha.length - 1].filhos.push(no); pilha.push(no);
  });
  const conteudo = t => {
    const cx = t.match(/^\[( |x|X)\]\s+(.*)$/);
    return cx ? `<input type="checkbox" disabled ${cx[1] === ' ' ? '' : 'checked'}> ${inl(cx[2])}` : inl(t);
  };
  const rend = nos => {
    if (!nos.length) return '';
    const tag = nos[0].ord ? 'ol' : 'ul';
    return `<${tag}>` + nos.map(n => {
      if (!n.filhos.length) return `<li>${conteudo(n.texto)}</li>`;
      const k = nid + ':' + hashStr(n.texto);
      return `<li class="k"><details ${rsFechados.has(k) ? '' : 'open'} data-k="${k}" ontoggle="rsToggle(this)"><summary>${conteudo(n.texto)}</summary>${rend(n.filhos)}</details></li>`;
    }).join('') + `</${tag}>`;
  };
  return rend(raiz.filhos);
}
function rsToggle(d) { if (d.open) rsFechados.delete(d.dataset.k); else rsFechados.add(d.dataset.k); }

function inserir(ta, txt) {
  if (!document.execCommand || !document.execCommand('insertText', false, txt)) {
    ta.setRangeText(txt, ta.selectionStart, ta.selectionEnd, 'end');
    ta.dispatchEvent(new Event('input'));
  }
}
function rsIndentar(ta, volta) {
  const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  const ini = v.lastIndexOf('\n', a - 1) + 1;
  let fim = v.indexOf('\n', b); if (fim < 0) fim = v.length;
  let dA = 0, dT = 0;
  const novas = v.slice(ini, fim).split('\n').map((l, i) => {
    if (!volta) { if (i === 0) dA = 2; dT += 2; return '  ' + l; }
    const r = l.startsWith('  ') ? 2 : (l.startsWith(' ') || l.startsWith('\t')) ? 1 : 0;
    if (i === 0) dA = -r; dT -= r;
    return l.slice(r);
  });
  ta.setSelectionRange(ini, fim);
  inserir(ta, novas.join('\n'));
  ta.setSelectionRange(Math.max(ini, a + dA), Math.max(ini, b + dT));
}
function rsTecla(e) {
  const ta = e.target;
  if (e.key === 'Tab') { e.preventDefault(); rsIndentar(ta, e.shiftKey); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey && ta.selectionStart === ta.selectionEnd) {
    const pos = ta.selectionStart, ini = ta.value.lastIndexOf('\n', pos - 1) + 1, linha = ta.value.slice(ini, pos);
    const m = linha.match(/^(\s*)([-*+]|\d+[.)])\s(\[[ xX]\]\s)?/);
    if (!m || pos - ini < m[0].length) return;
    e.preventDefault();
    if (!linha.slice(m[0].length).trim()) {     // marcador vazio: sai do nível (ou encerra a lista)
      ta.setSelectionRange(ini, pos);
